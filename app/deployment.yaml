apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-ci-lab
  namespace: python-ci-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: python-ci-lab
  template:
    metadata:
      labels:
        app: python-ci-lab
    spec:
      containers:
        - name: app
          image: ghcr.io/perolasanta/python-ci-lab:sha-ed644265fc620d5f1008311bd94a29239d8411c3
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            configMapRef:
              name: python-ci-lab-config
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
         
---
apiVersion: v1
kind: Service
metadata:
  name: python-ci-lab
  namespace: python-ci-lab
spec:
  selector:
    app: python-ci-lab
  ports:
    - port: 80
      targetPort: http
  type: ClusterIP
